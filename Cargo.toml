# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "terminal-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Terminal for sicompass: a shell as a list, with full-screen programs in a dashboard, as a plugin"
repository = "https://github.com/friendlyflow/terminal-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The provider is the library,
# which the unit tests use.
[[bin]]
name = "terminal-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
# The terminal emulator behind the interactive dashboard.
vte = "0.15"
# Natural sort for the folder listing, matching the file browser.
natord = "1"

# The shell's pseudo-terminal (ConPTY on Windows).
portable-pty = "0.9"

# The login shell (getpwuid_r), the host name, and the shell's directory on
# macOS (proc_pidinfo).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
